name: Site público
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      # Conteúdo e dados consumidos pelo build do site.
      - 'docs/*.md'
      - 'published/items.jsonl'
      - 'results/*.json'
      - 'CITATION.cff'
      # Código e dependências da exportação dos dados públicos.
      - 'teor/**'
      - 'config/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/pages.yml'
      - '!**/.DS_Store'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      PUBLIC_ANALYTICS_ENABLED: ${{ vars.PUBLIC_ANALYTICS_ENABLED || 'true' }}
      PUBLIC_CLARITY_PROJECT_ID: ${{ vars.PUBLIC_CLARITY_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      # Sem dataset explicitamente aprovado, a publicação mostra o estado vazio.
      - name: Exportar pacote público aprovado, quando existir
        run: |
          if [ -f published/items.jsonl ]; then
            python -m pip install uv
            uv sync --frozen --no-dev
            uv run teor site export published/items.jsonl --results results
          fi
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
