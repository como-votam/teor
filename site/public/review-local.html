<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Revisão local · Teor</title><style>body{font:16px system-ui;color:#041627;background:#f9f9fb;max-width:900px;padding:2rem;margin:auto}button,input,select,textarea{font:inherit;padding:.6rem;margin:.5rem 0}label{display:block}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:1rem;border:1px solid #d7dade}button{background:#1b6d24;color:white;border:0;border-radius:4px}textarea{width:100%;min-height:90px}:focus-visible{outline:3px solid #1b6d24;outline-offset:3px}</style></head><body><h1>Revisar um lote</h1><p>Abra o arquivo review-batch.json exportado pela CLI. As respostas ficam nesta sessão; exporte antes de fechar. Não há envio para um servidor.</p><label>Lote local<input id="file" type="file" accept="application/json"></label><label>Identificação do revisor<input id="reviewer" required></label><section id="work" hidden><h2 id="position"></h2><pre id="item"></pre><label>Julgamento<select id="judgement"><option value="supported">Sustentado pela fonte</option><option value="unsupported">Não sustentado</option><option value="uncertain">Não foi possível decidir</option></select></label><label>Evidência e motivo<textarea id="evidence" required></textarea></label><button id="save">Registrar e avançar</button></section><p id="status" role="status"></p><button id="export" disabled>Exportar revisões</button><script>
let items=[],reviews=[],index=0;const el=id=>document.getElementById(id);function show(){el('work').hidden=index>=items.length;if(index<items.length){el('position').textContent=`Item ${index+1} de ${items.length}`;el('item').textContent=JSON.stringify(items[index],null,2);el('evidence').value='';}else el('status').textContent='Lote concluído. Exporte as revisões.';}
el('file').onchange=async event=>{try{const payload=JSON.parse(await event.target.files[0].text());if(!Array.isArray(payload.items))throw Error('Lote inválido');items=payload.items;reviews=[];index=0;el('export').disabled=true;show();}catch(error){el('status').textContent=String(error);}};
el('save').onclick=()=>{const reviewer=el('reviewer').value.trim(),evidence=el('evidence').value.trim();if(!reviewer||!evidence){el('status').textContent='Informe revisor e evidência.';return;}const item=items[index];reviews.push({schema_version:'1.0',item_id:item.item_id,item_hash:item.item_hash,reviewer,judgement:el('judgement').value,evidence,claim_index:item.claim_index??null,prediction_id:item.prediction_id??null,adjudication:false,reviewed_at:new Date().toISOString()});index++;el('export').disabled=false;el('status').textContent=`${reviews.length} revisões registradas.`;show();};
el('export').onclick=()=>{const blob=new Blob([reviews.map(r=>JSON.stringify(r)).join('\n')+'\n'],{type:'application/x-ndjson'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='reviews.jsonl';link.click();URL.revokeObjectURL(url);};
</script></body></html>
